[package]
name = "hyper-terminal"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/lib-terminal"
publish = false
description = "Native terminal settings, events and capability client"
workspace = "../../app"

[features]
default = ["client"]
client = ["dep:hyper-os"]

[dependencies]

[dependencies.hyper-os]
workspace = true
optional = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
